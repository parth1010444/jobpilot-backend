# Overlay only. Main application.yml remains the source of app settings.
spring:
  datasource:
    url: jdbc:h2:mem:jobpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

jobpilot:
  jwt:
    secret: test-only-jwt-secret-key-at-least-32-bytes-long!!
    expiration-ms: 3600000
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  openapi:
    enabled: true
  reminders:
    scheduler:
      enabled: false
  outbox:
    relay:
      enabled: false
  kafka:
    consumer:
      enabled: false
  redis:
    enabled: false
  rate-limit:
    enabled: true
    default-limit: 10000
    auth-limit: 10000
    window: 1m

