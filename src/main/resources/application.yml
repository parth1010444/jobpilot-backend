spring:
  application:
    name: jobpilot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobpilot}
    username: ${SPRING_DATASOURCE_USERNAME:jobpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${JOBPILOT_KAFKA_CONSUMER_GROUP_ID:jobpilot-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

# JWT — local/test defaults only. Production MUST override JOBPILOT_JWT_SECRET.
jobpilot:
  jwt:
    secret: ${JOBPILOT_JWT_SECRET:local-dev-only-change-me-use-a-long-random-secret-at-least-32-bytes}
    expiration-ms: ${JOBPILOT_JWT_EXPIRATION_MS:86400000}
  reminders:
    scheduler:
      enabled: ${JOBPILOT_REMINDERS_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${JOBPILOT_REMINDERS_SCHEDULER_FIXED_DELAY_MS:60000}
  outbox:
    application-events-topic: ${JOBPILOT_OUTBOX_APPLICATION_EVENTS_TOPIC:jobpilot.application.events}
    relay:
      enabled: ${JOBPILOT_OUTBOX_RELAY_ENABLED:true}
      fixed-delay-ms: ${JOBPILOT_OUTBOX_RELAY_FIXED_DELAY_MS:5000}
      batch-size: ${JOBPILOT_OUTBOX_RELAY_BATCH_SIZE:50}
      max-attempts: ${JOBPILOT_OUTBOX_RELAY_MAX_ATTEMPTS:5}
  kafka:
    consumer:
      enabled: ${JOBPILOT_KAFKA_CONSUMER_ENABLED:true}
      group-id: ${JOBPILOT_KAFKA_CONSUMER_GROUP_ID:jobpilot-backend}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.jobpilot: INFO
    org.springframework.web: INFO
