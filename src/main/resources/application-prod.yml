# Production overlay. Activate with SPRING_PROFILES_ACTIVE=prod
# Fail closed: no Swagger, no default CORS origins, JWT secret must be supplied.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jobpilot:
  openapi:
    enabled: false
  cors:
    allowed-origins: ${JOBPILOT_CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JOBPILOT_JWT_SECRET}
