services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Bitnami Kafka in KRaft mode (no ZooKeeper). Host apps use localhost:9092.
  # bitnami/kafka versioned tags were moved off Docker Hub in Aug 2025; use the legacy archive.
  kafka:
    image: bitnamilegacy/kafka:3.9.0
    container_name: jobpilot-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional application container. Start with:
  #   docker compose --profile app up --build
  # Note: Kafka advertised listener is localhost (for host-run Spring Boot). Prefer
  # running the app on the host against compose postgres+kafka, or override bootstrap.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobpilot-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobpilot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobpilot}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      SERVER_PORT: 8080
      JOBPILOT_JWT_SECRET: ${JOBPILOT_JWT_SECRET:-local-dev-only-change-me-use-a-long-random-secret-at-least-32-bytes}
      JOBPILOT_JWT_EXPIRATION_MS: ${JOBPILOT_JWT_EXPIRATION_MS:-86400000}
      JOBPILOT_OUTBOX_RELAY_ENABLED: ${JOBPILOT_OUTBOX_RELAY_ENABLED:-true}
      JOBPILOT_KAFKA_CONSUMER_ENABLED: ${JOBPILOT_KAFKA_CONSUMER_ENABLED:-true}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
